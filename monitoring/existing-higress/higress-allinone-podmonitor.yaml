# Higress All-in-One PodMonitor
# 用于 Prometheus Operator 采集 Higress all-in-one 的监控指标

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: higress-allinone
  namespace: agent
  labels:
    app: higress-allinone
    release: prometheus
spec:
  selector:
    matchLabels:
      app: higress-allinone
  podMetricsEndpoints:
    # 15020: pilot-agent stats/prometheus 端口（推荐）
    - port: stats-prom
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: instance
          replacement: 'higress-allinone'
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
      # 移除 metricRelabelings 过滤，保留所有指标（包括 container_memory）
