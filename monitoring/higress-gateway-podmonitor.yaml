# Higress Gateway PodMonitor
# 用于收集 Higress Gateway 的监控指标，包括内存使用情况
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: higress-gateway
  namespace: higress-system
  labels:
    app: higress-gateway
    release: prometheus
spec:
  selector:
    matchLabels:
      app: higress-gateway
  podMetricsEndpoints:
    - port: stats-prom
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
      # 可选：添加 metricRelabelings 来过滤指标
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: instance
          replacement: 'higress-gateway'
      metricRelabelings:
        # 只保留与内存相关的指标（可选）
        - sourceLabels: [__name__]
          regex: '.*container_memory.*|.*process_memory.*|.*go_mem.*|.*envoy_memory.*'
          action: keep
