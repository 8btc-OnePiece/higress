# Consumer Group Mapping Plugin 配置示例（简化版）
#
# 此配置演示如何通过调用外部接口获取分组信息，实现消费者共享认证凭证
#
# 主要改进：
# 1. 只需配置完整的 API URL，不再需要复杂的 serviceSource、serviceName 等
# 2. 使用 apiClient.Call() 方式调用 HTTP 接口，更简洁可靠
# 3. 支持任意 HTTP/HTTPS 接口

# ====================================
# 最简配置（使用默认值）
# ====================================
global:
  consumer-group-mapping:
    # 其他配置都使用默认值，只需提供 API URL
    apiUrl: ""

# ====================================
# 完整配置示例
# ====================================
global:
  consumer-group-mapping:
    # API Key 参数名称（传递给外部接口）
    # 默认: key
    apiKeyParamName: "key"

    # 从哪个请求头获取消费者的 API Key
    # 默认: Authorization
    authHeader: "Authorization"

    # 外部 API 的完整 URL
    # 支持任意 HTTP/HTTPS 接口
    apiUrl: ""

    # HTTP 调用超时时间（毫秒）
    # 默认: 5000
    timeout: 5000

# ====================================
# 工作流程
# ====================================
#
# 1. 客户端发送请求:
#    curl -H "Authorization: Bearer consumer-key-12345" \
#         http://gateway/api/test
#
# 2. 插件处理流程:
#    a) 从 Authorization header 提取: consumer-key-12345
#    b) 调用外部 API:
#       GET http://gate.wujieai.com/apiKey/groupInfos?key=consumer-key-12345
#    c) 获取分组 Key: group-shared-key-67890
#    d) 添加 header: X-Original-Api-Key: consumer-key-12345
#    e) 替换 header: Authorization: Bearer group-shared-key-67890
#
# 3. Key Auth 插件认证:
#    使用 group-shared-key-67890 进行认证
#
# 4. 插件还原（鉴权后）:
#    Authorization: Bearer consumer-key-12345
#
# 5. 发送到上游服务:
#    Authorization: Bearer consumer-key-12345
#    X-Original-Api-Key: consumer-key-12345
#
# ====================================

# ====================================
# 外部接口规范
# ====================================
#
# 接口地址: GET {apiUrl}?key={consumerApiKey}
#
# 请求示例:
#   GET http://gate.wujieai.com/apiKey/groupInfos?key=consumer-key-12345
#
# 响应格式 (JSON):
#   方式 1 - 数组格式:
#   [
#     {
#       "id": 1,
#       "groupName": "production-group",
#       "groupKey": "group-shared-key-67890"
#     }
#   ]
#
#   方式 2 - 对象格式:
#   {
#     "code": 200,
#     "data": [
#       {
#         "name": "production-group",
#         "key": "group-shared-key-67890"
#       }
#     ]
#   }
#
#   方式 3 - 直接对象:
#   {
#     "groupKey": "group-shared-key-67890"
#   }
#
# ====================================

# ====================================
# 不同 API 的配置示例
# ====================================
#
# 示例 1: 标准 HTTP API
api_example_1:
  apiUrl: "http://api.example.com/groupInfos"

# 示例 2: HTTPS API
api_example_2:
  apiUrl: "https://secure-api.example.com/v1/consumer/group"

# 示例 3: 带 path 参数的 API
api_example_3:
  apiKeyParamName: "consumerId"
  apiUrl: "http://api.example.com/consumer/{id}/group"
  # 注意：当前版本需要在代码中处理 path 参数，暂不支持

# 示例 4: 自定义 header
# 如果需要在请求中添加自定义 header，需要修改代码添加
#
# 示例 5: 使用不同的认证 header
api_example_5:
  authHeader: "X-API-Key"  # 从 X-API-Key header 获取
  apiUrl: "http://api.example.com/groupInfos"
