apiVersion: 1.0.0

info:
  category: custom
  name: consumer-group-mapping/v1
  title: Consumer Group Mapping
  description: 本插件通过调用外部接口动态获取消费者分组信息，实现多个消费者共享认证凭证。在鉴权前将消费者标识替换为分组标识进行认证，鉴权后还原为原始消费者标识，对上游服务完全透明。
  x-description-i18n:
    en-US: This plugin dynamically fetches consumer group information by calling an external API, enabling multiple consumers to share authentication credentials. It replaces consumer identity with group identity before authentication and restores it after, making the process completely transparent to upstream services.
  iconUrl: https://img.alicdn.com/imgextra/i2/O1CN01z3z5xz1iVZ2VCvtxL_!!6000000004429-2-tps-42-42.png
  version: 1.0.0
  contact:
    name: Higress Team
    url: http://higress.cn/
    email: admin@higress.io

spec:
  phase: AUTHN
  priority: 100

  configSchema:
    openAPIV3Schema:
      type: object
      x-scope: GLOBAL

      properties:
        authHeader:
          type: string
          title: 认证 Header 名称
          x-title-i18n:
            en-US: Authentication Header Name
          description: 从哪个请求头获取 API Key，默认为 Authorization
          x-description-i18n:
            en-US: The request header name to get the API key from. Default is Authorization.
          default: Authorization
          example: Authorization

        groupInfoApi:
          type: string
          title: 分组信息查询接口
          x-title-i18n:
            en-US: Group Info API Path
          description: 查询分组信息的 API 接口路径，默认为 /apiKey/groupInfos
          x-description-i18n:
            en-US: The API endpoint path to query group information. Default is /apiKey/groupInfos.
          default: /apiKey/groupInfos
          example: /apiKey/groupInfos

        apiKeyParamName:
          type: string
          title: API Key 参数名称
          x-title-i18n:
            en-US: API Key Parameter Name
          description: 调用分组信息接口时，传递 API Key 的参数名，默认为 key
          x-description-i18n:
            en-US: The parameter name used to pass the API key when calling the group info API. Default is key.
          default: key
          example: key

        serviceSource:
          type: string
          title: 服务来源
          x-title-i18n:
            en-US: Service Source
          description: 分组信息服务的来源类型，支持 kubernetes 服务发现、Nacos、静态 IP 或 DNS
          x-description-i18n:
            en-US: The service discovery type for the group information service. Supports Kubernetes service discovery, Nacos, static IP, or DNS.
          enum:
            - k8s
            - nacos
            - ip
            - dns
          example: k8s

        serviceName:
          type: string
          title: 服务名称
          x-title-i18n:
            en-US: Service Name
          description: 分组信息服务的名称（k8s/nacos/dns）或 IP 地址（ip）
          x-description-i18n:
            en-US: The service name for k8s/nacos/dns or IP address for ip mode.
          minLength: 1
          maxLength: 256
          example: api-group-service

        servicePort:
          type: integer
          title: 服务端口
          x-title-i18n:
            en-US: Service Port
          description: 分组信息服务的端口
          x-description-i18n:
            en-US: The port number of the group information service.
          minimum: 1
          maximum: 65535
          example: 8080

        namespace:
          type: string
          title: 命名空间
          x-title-i18n:
            en-US: Namespace
          description: 当 serviceSource 为 k8s 或 nacos 时，指定服务的命名空间。k8s 使用命名空间名称，nacos 使用命名空间 ID
          x-description-i18n:
            en-US: When serviceSource is k8s or nacos, specify the service namespace. For k8s, use the namespace name; for nacos, use the namespace ID.
          maxLength: 256
          example: default

        domain:
          type: string
          title: 域名
          x-title-i18n:
            en-US: Domain
          description: 当 serviceSource 为 dns 时，指定服务的域名
          x-description-i18n:
            en-US: When serviceSource is dns, specify the service domain name.
          maxLength: 256
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_.]*[a-zA-Z0-9]*(:[0-9]+)?$"
          example: api.example.com

      required:
        - serviceSource
        - serviceName
        - servicePort

      example:
        authHeader: Authorization
        groupInfoApi: /apiKey/groupInfos
        apiKeyParamName: key
        serviceSource: k8s
        serviceName: api-group-service
        servicePort: 8080
        namespace: default
