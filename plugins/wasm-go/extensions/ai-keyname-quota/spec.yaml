apiVersion: 1.0.0

info:
  category: ai
  name: ai-keyname-quota/v1
  title: AI KeyName Quota Management
  description: 本插件通过远端 API 查询 API Key 对应的 KeyName，根据 KeyName 前缀匹配不同的配额池，实现基于前缀的 AI Token 配额管理。支持多租户、多业务线的配额隔离，配额自动初始化，根据实际 Token 使用量扣减。
  x-description-i18n:
    en-US: This plugin queries the KeyName corresponding to the API Key via a remote API, matches different quota pools based on the KeyName prefix, and implements prefix-based AI Token quota management. Supports multi-tenant and multi-business line quota isolation, automatic quota initialization, and deduction based on actual Token usage.
  iconUrl: https://img.alicdn.com/imgextra/i2/O1CN01z3z5xz1iVZ2VCvtxL_!!6000000004429-2-tps-42-42.png
  version: 1.0.0
  contact:
    name: Higress Team
    url: http://higress.cn/
    email: admin@higress.io

spec:
  phase: AUTHN
  priority: 290

  configSchema:
    openAPIV3Schema:
      type: object
      x-scope: GLOBAL

      properties:
        authHeader:
          type: string
          title: 认证 Header 名称
          x-title-i18n:
            en-US: Authentication Header Name
          description: 从哪个请求头获取 API Key，默认为 Authorization
          x-description-i18n:
            en-US: The request header name to get the API key from. Default is Authorization.
          default: Authorization
          example: Authorization

        apiKeyParamName:
          type: string
          title: API Key 参数名称
          x-title-i18n:
            en-US: API Key Parameter Name
          description: 调用 keyname 查询接口时，传递 API Key 的参数名，默认为 key
          x-description-i18n:
            en-US: The parameter name used to pass the API key when calling the keyname query API. Default is key.
          default: key
          example: key

        global_redis_key_prefix:
          type: string
          title: 全局 Redis Key 前缀
          x-title-i18n:
            en-US: Global Redis Key Prefix
          description: 所有配额池的 Redis key 前缀，默认为 "keyname_quota:"
          x-description-i18n:
            en-US: The Redis key prefix for all quota pools. Default is "keyname_quota:"
          default: "keyname_quota:"
          example: "keyname_quota:"

        unmatched_action:
          type: string
          title: 未匹配时的行为
          x-title-i18n:
            en-US: Action When Unmatched
          description: 当 keyname 不匹配任何配额池时的行为：continue(放行) 或 reject(拒绝)，默认为 continue
          x-description-i18n:
            en-US: The action to take when the keyname does not match any quota pool: continue (allow) or reject (deny). Default is continue.
          enum: ["continue", "reject"]
          default: "continue"
          example: "continue"

        keyNameService:
          type: object
          title: KeyName 查询服务配置
          x-title-i18n:
            en-US: KeyName Query Service Configuration
          description: 用于查询 keyname 的远端 API 服务配置
          x-description-i18n:
            en-US: Configuration for the remote API service used to query keyname
          properties:
            service_name:
              type: string
              title: 服务名称
              x-title-i18n:
                en-US: Service Name
              description: Higress Console 中的服务名称，例如 keyname-service.default.svc.cluster.local
              x-description-i18n:
                en-US: The service name in Higress Console, e.g., keyname-service.default.svc.cluster.local
              minLength: 1
              maxLength: 256
              example: keyname-service.default.svc.cluster.local

            api_url:
              type: string
              title: API 完整 URL
              x-title-i18n:
                en-US: API Complete URL
              description: 查询 keyname 接口的完整 URL
              x-description-i18n:
                en-US: The complete URL of the keyname query API
              minLength: 1
              maxLength: 2048
              example: "http://keyname-service:8080/api/keyinfo"

            timeout:
              type: integer
              title: 超时时间(毫秒)
              x-title-i18n:
                en-US: Timeout (ms)
              description: HTTP 调用超时时间，默认为 5000ms
              x-description-i18n:
                en-US: HTTP call timeout in milliseconds. Default is 5000ms
              minimum: 100
              maximum: 60000
              default: 5000
              example: 5000

          required:
            - service_name
            - api_url

        redis:
          type: object
          title: Redis 配置
          x-title-i18n:
            en-US: Redis Configuration
          description: Redis 连接配置
          x-description-i18n:
            en-US: Redis connection configuration
          properties:
            service_name:
              type: string
              title: 服务名称
              x-title-i18n:
                en-US: Service Name
              description: Redis 服务名称，带服务类型的完整 FQDN 名称
              x-description-i18n:
                en-US: Redis service name with full FQDN
              minLength: 1
              maxLength: 256
              example: redis-service.default.svc.cluster.local

            service_port:
              type: integer
              title: 服务端口
              x-title-i18n:
                en-US: Service Port
              description: Redis 服务端口，默认为 6379
              x-description-i18n:
                en-US: Redis service port. Default is 6379
              minimum: 1
              maximum: 65535
              default: 6379
              example: 6379

            username:
              type: string
              title: 用户名
              x-title-i18n:
                en-US: Username
              description: Redis 用户名
              x-description-i18n:
                en-US: Redis username
              maxLength: 256
              example: ""

            password:
              type: string
              title: 密码
              x-title-i18n:
                en-US: Password
              description: Redis 密码
              x-description-i18n:
                en-US: Redis password
              maxLength: 256
              example: ""
              format: password

            timeout:
              type: integer
              title: 超时时间
              x-title-i18n:
                en-US: Timeout
              description: Redis 连接超时时间，单位毫秒，默认为 1000
              x-description-i18n:
                en-US: Redis connection timeout in milliseconds. Default is 1000
              minimum: 100
              maximum: 60000
              default: 1000
              example: 2000

            database:
              type: integer
              title: 数据库
              x-title-i18n:
                en-US: Database
              description: 使用的数据库 id，默认为 0
              x-description-i18n:
                en-US: The database id to use. Default is 0
              minimum: 0
              maximum: 15
              default: 0
              example: 0

          required:
            - service_name

        quota_pools:
          type: array
          title: 配额池列表
          x-title-i18n:
            en-US: Quota Pools
          description: 配额池配置列表，按顺序匹配
          x-description-i18n:
            en-US: List of quota pool configurations, matched in order
          minItems: 1
          items:
            type: object
            properties:
              key_name_prefix:
                type: string
                title: KeyName 前缀
                x-title-i18n:
                  en-US: KeyName Prefix
                description: 匹配的 keyname 前缀，例如 "外部培训", "内部"
                x-description-i18n:
                  en-US: The keyname prefix to match, e.g., "外部培训", "内部"
                minLength: 1
                maxLength: 256
                example: "外部培训"

              quota_limit:
                type: integer
                title: 配额限制
                x-title-i18n:
                  en-US: Quota Limit
                description: 该配额池的 token 数量限制，例如 1000000 (100w)
                x-description-i18n:
                  en-US: The token quota limit for this pool, e.g., 1000000 (1M)
                minimum: 1
                example: 1000000

              redis_key_prefix:
                type: string
                title: Redis Key 前缀
                x-title-i18n:
                  en-US: Redis Key Prefix
                description: 该配额池在 Redis 中的 key 后缀，默认使用 key_name_prefix
                x-description-i18n:
                  en-US: The Redis key suffix for this pool. Default uses key_name_prefix
                maxLength: 256
                example: "external_training"

            required:
              - key_name_prefix
              - quota_limit

      required:
        - keyNameService
        - redis
        - quota_pools

      example:
        authHeader: "Authorization"
        apiKeyParamName: "key"
        global_redis_key_prefix: "keyname_quota:"
        unmatched_action: "continue"
        keyNameService:
          service_name: keyname-service.default.svc.cluster.local
          api_url: "http://keyname-service:8080/api/keyinfo"
          timeout: 5000
        redis:
          service_name: redis-service.default.svc.cluster.local
          service_port: 6379
          timeout: 2000
          database: 0
        quota_pools:
          - key_name_prefix: "外部培训"
            quota_limit: 1000000
            redis_key_prefix: "external_training"
          - key_name_prefix: "内部"
            quota_limit: 10000000
            redis_key_prefix: "internal"