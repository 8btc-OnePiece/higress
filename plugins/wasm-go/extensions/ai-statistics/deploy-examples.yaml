### 场景 3：多租户配置

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  defaultConfigDisable: true

  matchRules:
    # 租户 A
    - config:
        reportApiUrl: "http://tenant-a.example.com/model/usage/report"
        reportServiceName: "tenant-a-service"
        attributes:
          - key: tenant_id
            value_source: fixed_value
            value: tenant_a
            apply_to_log: true
      configDisable: false
      ingress:
        - tenant-a-route.internal

    # 租户 B
    - config:
        reportApiUrl: "http://tenant-b.example.com/model/usage/report"
        reportServiceName: "tenant-b-service"
        attributes:
          - key: tenant_id
            value_source: fixed_value
            value: tenant_b
            apply_to_log: true
      configDisable: false
      ingress:
        - tenant-b-route.internal
```

