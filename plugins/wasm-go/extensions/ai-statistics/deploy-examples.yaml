# AI Statistics Plugin - 配置实例
#
# 本文件包含多种部署场景的配置示例

---

## ==========================================
## 方式一：Docker 镜像方式（推荐-企业内部）
## ==========================================

### 示例 1.1：基础配置（使用 Docker 镜像）

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
spec:
  # Docker 镜像地址（不带 oci:// 前缀）
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  imagePullPolicy: Always

  # 插件配置
  defaultConfig:
    # 必填：上报 API 配置
    reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
    reportServiceName: "pref.dns"
    reportTimeout: 5000

    # 可选：路径过滤
    enable_path_suffixes:
      - "/v1/chat/completions"
      - "/v1/completions"
      - "/generateContent"

    # 可选：响应类型过滤
    enable_content_types:
      - "text/event-stream"
      - "application/json"
```

---

### 示例 1.2：完整配置（带自定义属性）

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
  labels:
    env: production
    app: ai-proxy
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  imagePullPolicy: Always
  failStrategy: FAIL_OPEN  # 插件失败时的策略

  defaultConfig:
    # Token 上报配置
    reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
    reportServiceName: "pref.dns"
    reportTimeout: 5000

    # 路径过滤（统计特定接口）
    enable_path_suffixes:
      - "/v1/chat/completions"
      - "/v1/completions"
      - "/v1/embeddings"

    # 内容类型过滤
    enable_content_types:
      - "text/event-stream"
      - "application/json"

    # 自定义属性（用于日志和追踪）
    attributes:
      # 从请求头提取
      - key: x_request_id
        value_source: request_header
        value: X-Request-Id
        apply_to_log: true

      # 从请求体提取（JSONPath）
      - key: model
        value_source: request_body
        value: model
        apply_to_log: true

      # 从响应体提取
      - key: response_id
        value_source: response_body
        value: id
        apply_to_log: true

      # 固定值
      - key: environment
        value_source: fixed_value
        value: production
        apply_to_log: true
```

---

### 示例 1.3：按路由配置（matchRules）

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  imagePullPolicy: Always

  # 全局默认禁用
  defaultConfigDisable: true
  failStrategy: FAIL_OPEN

  # 按路由匹配规则
  matchRules:
    # 规则 1：DeepSeek 模型路由
    - config:
        reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
        reportServiceName: "pref.dns"
        reportTimeout: 5000
        enable_path_suffixes:
          - "/v1/chat/completions"
      configDisable: false  # 启用此规则
      ingress:
        - ai-route-deepseek.internal
        - ai-route-deepseek-v3.1.internal

    # 规则 2：其他模型路由
    - config:
        reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
        reportServiceName: "pref.dns"
        reportTimeout: 5000
        enable_path_suffixes:
          - "/v1/completions"
      configDisable: false
      ingress:
        - ai-route-gpt.internal
        - ai-route-claude.internal
```

