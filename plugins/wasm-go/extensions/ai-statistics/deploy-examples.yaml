## 方式二：OCI 镜像方式（标准规范）
## ==========================================

### 示例 2.1：基础配置（使用 OCI 镜像）

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
spec:
  # OCI 镜像地址（带 oci:// 前缀）
  url: oci://registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-statistics:1.0.0
  phase: AUTHN
  priority: 100
  imagePullPolicy: Always

  defaultConfig:
    reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
    reportServiceName: "pref.dns"
    reportTimeout: 5000
```

---

### 示例 2.2：按域名配置

```yaml
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
spec:
  url: oci://registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-statistics:1.0.0
  phase: AUTHN
  priority: 100

  matchRules:
    - config:
        reportApiUrl: "http://pref-gate.wujieai.com/open-platform-private/model/usage/report"
        reportServiceName: "pref.dns"
      configDisable: false
      domain:
        - ai.example.com
        - api.example.com
```

