## ==========================================
## 监控和调试
## ==========================================

### 查看插件指标

```bash
# Higress 提供的插件相关指标
kubectl exec -n higress-system <gateway-pod> -- curl -s localhost:15000/stats | grep wasm
```

### 启用调试日志

```yaml
# 在 Higress Gateway 的 Deployment 中添加
spec:
  template:
    spec:
      containers:
      - name: higress-gateway
        args:
          - --log-level=debug
```

### 常用日志查询

```bash
# 查看所有 Wasm 插件日志
kubectl logs -n higress-system <gateway-pod> | grep -i wasm

# 查看 ai-statistics 日志
kubectl logs -n higress-system <gateway-pod> | grep "ai-statistics"

# 查看上报相关日志
kubectl logs -n higress-system <gateway-pod> | grep "reporting token"

# 查看错误日志
kubectl logs -n higress-system <gateway-pod> | grep -i "error.*ai-statistics"
```

