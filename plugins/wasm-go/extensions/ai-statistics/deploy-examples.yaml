### 场景 1：多环境部署

```yaml
# 开发环境
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics-dev
  namespace: higress-system
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  defaultConfig:
    reportApiUrl: "http://dev-api.example.com/model/usage/report"
    reportServiceName: "dev-api-service"
    reportTimeout: 10000  # 开发环境超时时间更长
    attributes:
      - key: environment
        value_source: fixed_value
        value: development
        apply_to_log: true
```

```yaml
# 生产环境
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics-prod
  namespace: higress-system
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
