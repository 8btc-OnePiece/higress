### 场景 2：灰度发布（新旧版本共存）

```yaml
# 旧版本（v1.0.0）
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics-v1
  namespace: higress-system
spec:
  url: registry.cn-hangzhou.aliyuncs.com/higress-ailong/plugins:ai-statistics-1.0.0
  phase: AUTHN
  priority: 100
  defaultConfigDisable: true  # 默认禁用
  matchRules:
    - configDisable: false
      ingress:
        - legacy-route.internal  # 仅对旧路由生效
```

```yaml
# 新版本（v2.0.0）
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics-v2
  namespace: higress-system
spec:
