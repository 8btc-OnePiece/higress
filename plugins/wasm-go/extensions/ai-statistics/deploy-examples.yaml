## ==========================================
## 部署命令
## ==========================================

### 1. 应用配置

```bash
# 应用基础配置
kubectl apply -f ai-statistics-basic.yaml

# 应用完整配置
kubectl apply -f ai-statistics-full.yaml

# 应用按路由配置
kubectl apply -f ai-statistics-match-rules.yaml
```

### 2. 查看状态

```bash
# 查看插件列表
kubectl get wasmplugin -n higress-system

# 查看插件详情
kubectl describe wasmplugin ai-statistics -n higress-system

# 查看插件 YAML
kubectl get wasmplugin ai-statistics -n higress-system -o yaml
```

### 3. 更新配置

```bash
# 方式一：直接编辑
kubectl edit wasmplugin ai-statistics -n higress-system

# 方式二：应用新配置
kubectl apply -f ai-statistics-updated.yaml
```

### 4. 删除插件

```bash
kubectl delete wasmplugin ai-statistics -n higress-system
```

### 5. 验证功能

```bash
# 查看 Gateway 日志
kubectl logs -n higress-system -l app=higress-gateway --tail=100 | grep ai-statistics

# 发送测试请求
curl -X POST http://your-gateway/v1/chat/completions \
  -H "Content-Type: application/json" \
  -H "Authorization: Bearer your-api-key" \
  -d '{
    "model": "gpt-4",
    "messages": [{"role": "user", "content": "Hello"}]
  }'

# 检查上报日志
kubectl logs -n higress-system <gateway-pod> | grep "reporting token usage"
```

