## ==========================================
## 常见配置问题
## ==========================================

### Q1: URL 格式错误

**错误**：无法拉取镜像

**原因**：Docker 方式使用了 `oci://` 前缀，或 OCI 方式缺少 `oci://` 前缀

**解决**：
- Docker 方式：`url: registry.cn-hangzhou.aliyuncs.com/...`（无前缀）
- OCI 方式：`url: oci://registry.cn-hangzhou.cr.aliyuncs.com/...`（有前缀）

### Q2: 配置不生效

**错误**：插件已加载但未执行上报

**原因**：`defaultConfigDisable: true` 且未配置 `matchRules`

**解决**：
```yaml
spec:
  defaultConfigDisable: false  # 启用默认配置
  # 或配置 matchRules
  matchRules:
    - configDisable: false
```

### Q3: 找不到上报服务

**错误**：`failed to call report API`

**原因**：`reportServiceName` 配置的服务在 Higress 中不存在

**解决**：
```bash
# 检查服务是否存在
kubectl get svc -n <service-namespace> | grep <reportServiceName>

# 使用正确的服务名
reportServiceName: "existing-service-name"
```

### Q4: 路径匹配不正确

**错误**：某些请求未被统计

**原因**：`enable_path_suffixes` 配置过于严格

**解决**：
```yaml
# 方式一：统计所有路径
enable_path_suffixes:
  - "*"

# 方式二：放宽限制
enable_path_suffixes:
  - "/v1/"
  - "/generate"
```

